    "regista._claims_api",
    "regista._claims",
    "regista._cli",
    "regista._connection",
    "regista._contract",
    "regista._errors",
    "regista._events_api",
    "regista._events",
    "regista._event_store",
    "regista._hooks_api",
    "regista._hooks",
    "regista",
    "regista._in_memory_claims",
    "regista._in_memory_events",
    "regista._in_memory_hooks",
    "regista._in_memory_links",
    "regista._in_memory",
    "regista._in_memory_recurrence",

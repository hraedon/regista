[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regista-hraedon"
version = "0.8.0"
description = "An embeddable work-coordination ledger over PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16,<1",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src/regista"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "regista/migrations"

[project.scripts]
regista = "regista._cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]

# ---------------------------------------------------------------------------
# Static typing — strict.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/regista"]

# Untyped third-party libs (installed in CI via extras, but ship no stubs).
[[tool.mypy.overrides]]
module = ["rfc8785", "rfc8785.*"]
ignore_missing_imports = true
[build-system]
# Exactly pinned, including hatchling's whole dependency closure: an installer
# building the sdist resolves these into its isolated build environment, and the
# published-migration guard (#65) requires the pin so pip and uv run the same
# backend code. Update all of them together (`uv pip install hatchling==X` in a
# scratch venv, then `uv pip freeze`).
requires = [
    "hatchling==1.32.4",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[project]
name = "regista-hraedon"
version = "0.8.0"
description = "Durable work ownership and validated handoffs over PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
# Plan 032 D13: CI exercises 3.11–3.14; retain the floor without a speculative cap.
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16,<0.17",
    "mypy>=2.1,<3",
    "types-PyYAML",
    "types-jsonschema",
    "hypothesis>=6.168.4",
]

[project.scripts]
regista = "regista.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regista"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/regista", "/examples", "/tests", "/scripts", "/githooks",
    "/publication.toml", "/pyproject.toml", "/README.md", "/LICENSE",
    "/Makefile", "/docker-compose.test.yml", "/.github",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/regista"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regista-hraedon"
version = "0.5.5"
description = "Coordination + state plane for agent pipelines over Postgres"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "python-dateutil>=2.9",
    "pynacl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16,<1",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
    "types-python-dateutil",
    # CLI contract v1 conformance kit (Plan 018 WI-2), a normal pinned version
    # dependency (Plan 019 B1). Previously a git+SHA direct reference installed
    # by a separate CI step — which PyPI forbids in uploaded metadata; now a
    # published wheel, so it lives here like any other dev dep.
    "agent-suite-conformance==1.0.0; python_version >= '3.12'",
]

sidecar = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]
ed25519 = [
    "PyNaCl>=1.5",
]
encryption = [
    "cryptography>=42.0",
]
vendor-check = [
    "rfc8785==0.1.4",
]
timestamping = [
    "asn1crypto>=1.5",
]
anchoring = [
    "opentimestamps>=0.4",
]
vault = [
    "hvac>=2.0",
]
azure = [
    "azure-identity>=1.16",
    "azure-keyvault-secrets>=4.8",
]
windows = []

[tool.hatch.build.targets.wheel]
packages = ["src/regista"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "regista/migrations"

[project.scripts]
regista = "regista._cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
addopts = "-m 'not slow' --strict-markers"
markers = [
    "slow: scale benchmarks, skipped by default",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]

# ---------------------------------------------------------------------------
# Static typing — strict, adopted as a ratchet (WI-005).
#
# `strict = true` is enforced on every module NOT in the burndown list below.
# A cold strict run on this ~20k-LOC kernel surfaced ~1045 errors (mostly
# annotation-completeness: missing generic params + unannotated defs), too many
# to fix safely in one pass. So strict is on globally, full strict is enforced
# on the already-clean modules and on every NEW module, and the currently-dirty
# modules are quarantined with `ignore_errors` and burned down one PR at a time
# — each PR deletes module(s) from the list below. assert_never is deliberately
# NOT used here: regista's dispatch is data-driven (YAML workflows, DB
# vocabulary), so it has no Python-enum match sites to make exhaustive.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/regista"]

# Untyped third-party libs (installed in CI via extras, but ship no stubs).
[[tool.mypy.overrides]]
module = ["nacl", "nacl.*", "asn1crypto", "asn1crypto.*", "rfc8785", "rfc8785.*"]
ignore_missing_imports = true

# --- mypy --strict burndown (WI-233). The connection layer sets
#     row_factory=dict_row globally (_connection.py), so rows are dict[str, Any]
#     at runtime; the shared alias `DictConn = psycopg.Connection[dict[str, Any]]`
#     (in _connection.py) documents that and unlocks most modules. Modules below
#     still have remaining strict violations (complex generics, untyped
#     third-party calls, mixin attribute inference) and are burned down one PR
#     at a time. Delete entries as they are annotated. When this list is empty,
#     the kernel is fully strict.
#     NOTE: _projects is a pre-existing uncommitted WIP module; annotate or
#     remove when the projects-catalog feature is committed. ---
[[tool.mypy.overrides]]
module = [
    "regista._anchoring",
    "regista._api_async",
    "regista._api_meta",
    "regista._api_workflow",
    "regista._bundle",
    "regista._cli",
    "regista._contract",
    "regista._in_mem_base",
    "regista._in_mem_ops",
    "regista._in_mem_witness",
    "regista._in_mem_workflow",
    "regista._in_memory",
    "regista._in_memory_claims",
    "regista._in_memory_events",
    "regista._in_memory_hooks",
    "regista._in_memory_links",
    "regista._in_memory_recurrence",
    "regista._in_memory_replay",
    "regista._in_memory_transition",
    "regista._in_memory_work_items",
    "regista._ops",
    "regista._projects",
    "regista._recurrence",
    "regista._replay",
    "regista._secrets",
    "regista._signing",
    "regista._signing_scheme",
    "regista._timestamping",
    "regista._types",
    "regista._workflow",
    "regista._workflow_compose",
    "regista._witness",
    "regista.sidecar.app",
    "regista.sidecar.__main__",
    "regista.sidecar.models",
    "regista.sidecar.routes",
    "regista.sidecar.routes_hooks",
    "regista",
    "regista.principal_lifecycle",
]
ignore_errors = true

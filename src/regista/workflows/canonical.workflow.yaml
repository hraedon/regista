# A generic coordination lifecycle shipped as the canonical example workflow.
#
# Reach it via regista.canonical_workflow_yaml(); register the exact bytes with
# reg.register_workflow(regista.canonical_workflow_yaml()). Registration is
# idempotent.
#
# This is a plain role-gated state machine: it demonstrates states, transitions,
# roles, and typed fields. The reduced 0.8.0 kernel does not run in-transition
# validators or dispatch hooks, so this definition declares none.
#
# Lease is NOT a lifecycle state: claim/heartbeat/release use regista's native
# claims primitive (a concurrency/liveness axis orthogonal to workflow state).
name: canonical
version: 1
regista_version: "0.4.0"

states:
  - name: open
    initial: true
  - name: in_progress
  - name: blocked
  - name: deferred
  - name: in_review
  - name: done
    terminal: true

roles:
  - name: human
  - name: agent
  - name: system

transitions:
  - name: start
    from: open
    to: in_progress
    allowed_roles: [human, agent, system]
  - name: start
    from: deferred
    to: in_progress
    allowed_roles: [human, agent, system]

  - name: block
    from: in_progress
    to: blocked
    allowed_roles: [human, agent, system]
  - name: unblock
    from: blocked
    to: in_progress
    allowed_roles: [human, agent, system]

  - name: defer
    from: open
    to: deferred
    allowed_roles: [human, agent, system]
  - name: defer
    from: in_progress
    to: deferred
    allowed_roles: [human, agent, system]
  - name: resume
    from: deferred
    to: open
    allowed_roles: [human, agent, system]

  - name: submit_for_review
    from: in_progress
    to: in_review
    allowed_roles: [human, agent, system]
  - name: request_changes
    from: in_review
    to: in_progress
    allowed_roles: [human, agent, system]
  - name: accept
    from: in_review
    to: done
    allowed_roles: [human, agent, system]
  - name: reject
    from: in_review
    to: in_progress
    allowed_roles: [human, agent, system]

  - name: reopen
    from: done
    to: open
    allowed_roles: [human, agent, system]

  - name: close_from_open
    from: open
    to: done
    allowed_roles: [human, agent, system]

  # Field-only self-transitions; one per non-terminal state. Regista resolves
  # `amend` by the work-item's current `from` state.
  - name: amend
    from: open
    to: open
    allowed_roles: [human, agent, system]
  - name: amend
    from: in_progress
    to: in_progress
    allowed_roles: [human, agent, system]
  - name: amend
    from: blocked
    to: blocked
    allowed_roles: [human, agent, system]
  - name: amend
    from: deferred
    to: deferred
    allowed_roles: [human, agent, system]
  - name: amend
    from: in_review
    to: in_review
    allowed_roles: [human, agent, system]

work_item_types:
  - name: task
    custom_fields:
      - name: title
        type: string
        required: true
        ui_visible: true
      - name: description
        type: string
        required: false
        ui_visible: true
      - name: priority
        type: enum
        enum_values: [low, normal, high, urgent]
        default: normal
        ui_visible: true
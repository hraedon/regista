name: Publish

# Build and publish regista-hraedon to PyPI when a version tag (v*) is pushed.
#
# Flow: a tag such as `v0.6.0` triggers a `verify` job (lint + type-check + the
# Postgres-backed test suite, mirroring ci.yml against the TAGGED tree, plus a
# tag==package-version guard), then a `build` job (`uv build` → sdist + wheel),
# then a `publish` job that uploads to PyPI. Each job `needs:` the previous one,
# so a tag can never publish code that did not pass the gate.
#
# AUTHENTICATION — pick ONE, configured by the repo owner before the first tag:
#
#   (A) Trusted Publishing  [RECOMMENDED — no stored secret]
#       Register this repository + this workflow file + the `pypi` environment as
#       a trusted publisher for the `regista-hraedon` project at
#       https://pypi.org/manage/account/publishing/ . The publish job's
#       `id-token: write` permission then mints a short-lived OIDC token and
#       `uv publish` (no token argument) uses it automatically.
#
#   (B) API token
#       Create a project-scoped token at https://pypi.org/manage/account/token/
#       and store it as the `PYPI_API_TOKEN` repository secret, then switch the
#       publish step to the token variant marked below.
#
# Nothing here reads a token from the host; publishing runs in GitHub Actions.
#
# PREFLIGHT (GitHub issue #70). Every tag from v0.6.0 through v0.7.2 failed at
# the OIDC exchange with `invalid-publisher`, even though the claims were right:
#   sub=repo:hraedon/regista:environment:pypi
#   job_workflow_ref=hraedon/regista/.github/workflows/publish.yml@refs/tags/vX
# PyPI had no trusted publisher registered for them. Registering one is a
# pypi.org account action, so this file cannot fix it. What it adds is a way
# to check the registration without cutting a release: dispatch this workflow
# from main (`gh workflow run publish.yml --ref main`). The dispatch runs ONLY
# the `oidc-preflight` job, which performs the OIDC exchange `uv publish` uses
# and reports PyPI's verdict. It uploads nothing, and it burns the upload token
# PyPI mints (PyPI acknowledges a burn with HTTP 202 and does not report
# the outcome). A pass confirms that PyPI currently accepts this workflow's
# identity under the publisher registration the tag run uses: owner,
# repository, workflow filename and environment. PyPI does not match on the
# ref or the event. A pass does not exercise the upload itself.
#
# PREREQUISITE before the first dispatch: protect the `pypi` environment
# (Settings -> Environments -> pypi). Require a reviewer, enable "Prevent
# self-review", disallow administrator bypass, and restrict deployment refs to
# branch `main` and tags `v*`. For that to be a real boundary, also protect
# `main` and guard creation of `v*` tags with a ruleset. Without that, anyone with
# write access can dispatch a MODIFIED publish.yml from any branch and get a
# live upload token. The `if:` above cannot stop that, because the modified
# copy is the one that runs. A writer can already reach the publish job by
# pushing a v* tag, so this adds no new principal, but it is an easier path.
# The environment's protection rules are the boundary for both.

on:
  push:
    tags:
      - "v*"
  # Preflight only: see PREFLIGHT above. Never builds or publishes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-preflight:
    name: Trusted-publisher preflight (uploads nothing)
    # Dispatches from main only. A tag ref has nothing to add: PyPI does not
    # match on the ref (see PREFLIGHT above).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi   # must match the registered publisher, as `publish` does
    permissions:
      id-token: write
    steps:
      - name: Exchange the GitHub OIDC token with PyPI, then burn the result
        # Everything happens in memory in one process. No response body is
        # written to disk, and no URL or server-controlled diagnostic text is
        # logged: failures show a fixed message per known PyPI error code. The
        # two credentials reach output only as escaped ::add-mask:: commands,
        # and only after matching their ASCII grammar.
        # The minted upload token is masked the moment it exists. A burn
        # request is sent for it, and anything but HTTP 202 fails the run.
        # Same host as `uv publish` (upload.pypi.org, the default publish
        # authority).
        shell: python3 {0}
        run: |
          import http.client, json, os, re, sys, urllib.error, urllib.request

          HOST = "https://upload.pypi.org"
          # PyPI error codes we explain. Anything else prints as "unrecognised":
          # server-controlled text (descriptions, unknown codes) is never logged.
          KNOWN = {
              "invalid-publisher": "no trusted publisher on PyPI matches these claims; "
                                   "register owner/repo/publish.yml/environment pypi",
              "invalid-payload": "PyPI could not parse the OIDC token",
              "invalid-token": "PyPI rejected the OIDC token",
              "not-enabled": "trusted publishing is disabled on PyPI",
          }

          # Both credentials are ASCII by specification: a GitHub OIDC token is a
          # compact JWS, and a PyPI upload token is "pypi-" plus base64url. Anything
          # else is refused BEFORE it reaches output. A line break would split the
          # ::add-mask:: command, unmasking the remainder and injecting a new runner
          # command. The mask data is also escaped as @actions/core does.
          JWT = re.compile(r"[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*")
          PYPI_TOKEN = re.compile(r"pypi-[A-Za-z0-9_-]+")

          def mask(value):
              escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::add-mask::{escaped}", flush=True)

          def fail(message):
              print(f"FAIL: {message}", flush=True)
              sys.exit(1)

          def call(label, url, data=None, headers=None):
              # Never print `url`: the GitHub request URL is a signed runtime URL.
              try:
                  req = urllib.request.Request(url, data=data, headers=headers or {})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return resp.status, resp.read()
                  except urllib.error.HTTPError as exc:
                      return exc.code, exc.read()
              except (OSError, ValueError, http.client.HTTPException) as exc:
                  fail(f"{label}: request failed ({exc.__class__.__name__})")

          def json_object(label, status, raw):
              try:
                  body = json.loads(raw)
              except ValueError:
                  fail(f"{label}: non-JSON body (HTTP {status}); body withheld")
              if not isinstance(body, dict):
                  fail(f"{label}: JSON body is not an object (HTTP {status}); body withheld")
              return body

          for var in ("ACTIONS_ID_TOKEN_REQUEST_URL", "ACTIONS_ID_TOKEN_REQUEST_TOKEN"):
              if not os.environ.get(var):
                  fail(f"{var} is not set; the job needs `permissions: id-token: write`")

          status, raw = call("audience endpoint", f"{HOST}/_/oidc/audience")
          audience = json_object("audience endpoint", status, raw).get("audience")
          if status != 200 or not isinstance(audience, str) or not re.fullmatch(r"[A-Za-z0-9._-]{1,64}", audience):
              fail(f"audience endpoint: unusable response (HTTP {status})")

          status, raw = call(
              "GitHub OIDC endpoint",
              f"{os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']}&audience={audience}",
              headers={"Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          oidc = json_object("GitHub OIDC endpoint", status, raw).get("value")
          if status != 200 or not isinstance(oidc, str) or not oidc:
              fail(f"GitHub OIDC endpoint: no token (HTTP {status})")
          if not JWT.fullmatch(oidc):
              fail("GitHub OIDC endpoint: token is not a compact JWS; withheld")
          mask(oidc)

          status, raw = call(
              "mint-token", f"{HOST}/_/oidc/mint-token",
              data=json.dumps({"token": oidc}).encode(),
              headers={"Content-Type": "application/json"},
          )
          body = json_object("mint-token", status, raw)
          token = body.get("token")
          well_formed = isinstance(token, str) and PYPI_TOKEN.fullmatch(token) is not None
          if well_formed:
              mask(token)
          if status == 200 and isinstance(token, str) and token:
              b_status, _ = call(
                  "burn-token", f"{HOST}/_/oidc/burn-token",
                  data=json.dumps({"token": token}).encode(),
                  headers={"Content-Type": "application/json"},
              )
              if not well_formed:
                  fail("PyPI minted a token that is not 'pypi-' plus base64url; it was "
                       f"withheld from output, and a burn was requested (HTTP {b_status}).")
              if b_status != 202:
                  fail("PyPI accepted the publisher, but did not accept the burn request "
                       f"(HTTP {b_status}). The upload token expires on its own within "
                       "15 minutes; treat this run as a credential exposure until then.")
              print("PASS: PyPI accepted this workflow as a trusted publisher. Nothing was "
                    "uploaded; the minted token was masked and its burn request accepted "
                    "(HTTP 202; PyPI does not report the revocation outcome).")
              sys.exit(0)
          if status == 200:
              fail("PyPI answered HTTP 200 without a usable token; body withheld")
          errors = body.get("errors")
          codes = [e.get("code") for e in errors if isinstance(e, dict)] if isinstance(errors, list) else []
          print(f"FAIL: PyPI refused the OIDC exchange (HTTP {status}).")
          for code in codes:
              if isinstance(code, str) and code in KNOWN:
                  print(f"  {code}: {KNOWN[code]}")
              else:
                  print("  (unrecognised error code; details withheld)")
          sys.exit(1)

  verify:
    name: Verify (lint, types, tests) before publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: regista_test
          POSTGRES_PASSWORD: regista_test
          POSTGRES_DB: regista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regista_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vendor-check,sidecar,ed25519,encryption,vault]"
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import importlib.metadata as m; print(m.version("regista-hraedon"))')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"
      - name: Lint
        run: ruff check src/ tests/ tools/
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest tests/ -q

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Build
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # (A) Trusted Publishing OIDC — remove if using (B)
    steps:
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      # (A) Trusted Publishing: no token needed once the publisher is registered.
      # `always` makes a failed OIDC exchange an error, with no fallback to
      # looking for credentials. Run the PREFLIGHT before tagging (#70).
      - name: Publish (trusted publishing)
        run: uv publish --trusted-publishing always
      # (B) API token variant — comment the step above and use this instead:
      # - name: Publish (API token)
      #   env:
      #     UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      #   run: uv publish --token "$UV_PUBLISH_TOKEN"

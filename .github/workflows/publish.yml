name: Publish

# Build and publish regista-hraedon to PyPI when a version tag (v*) is pushed.
#
# Flow: a tag such as `v0.6.0` triggers a `verify` job (lint + type-check + the
# Postgres-backed test suite, mirroring ci.yml against the TAGGED tree, plus a
# tag==package-version guard), then a `build` job (`uv build` → sdist + wheel),
# then a `publish` job that uploads to PyPI. Each job `needs:` the previous one,
# so a tag can never publish code that did not pass the gate.
#
# AUTHENTICATION — pick ONE, configured by the repo owner before the first tag:
#
#   (A) Trusted Publishing  [RECOMMENDED — no stored secret]
#       Register this repository + this workflow file + the `pypi` environment as
#       a trusted publisher for the `regista-hraedon` project at
#       https://pypi.org/manage/account/publishing/ . The publish job's
#       `id-token: write` permission then mints a short-lived OIDC token and
#       `uv publish` (no token argument) uses it automatically.
#
#   (B) API token
#       Create a project-scoped token at https://pypi.org/manage/account/token/
#       and store it as the `PYPI_API_TOKEN` repository secret, then switch the
#       publish step to the token variant marked below.
#
# Nothing here reads a token from the host; publishing runs in GitHub Actions.
#
# PREFLIGHT (GitHub issue #70). Every tag from v0.6.0 through v0.7.2 failed at
# the OIDC exchange with `invalid-publisher`, even though the claims were right:
#   sub=repo:hraedon/regista:environment:pypi
#   job_workflow_ref=hraedon/regista/.github/workflows/publish.yml@refs/tags/vX
# PyPI had no trusted publisher registered for them. Registering one is a
# pypi.org account action, so this file cannot fix it. What it can do is let
# the registration be PROVEN before the next tag rather than discovered
# after it: run this workflow by hand (Actions -> Publish -> Run workflow, or
# `gh workflow run publish.yml --ref main`). The dispatch runs ONLY the
# `oidc-preflight` job. That job performs the same OIDC exchange `uv publish`
# would and reports PyPI's verdict. It uploads nothing. The short-lived upload
# token PyPI mints on success (15 minutes) is never printed or stored. PyPI
# matches the publisher on owner, repository, workflow filename and
# environment, not on the ref or the event, so a pass here predicts a pass on
# the tag.

on:
  push:
    tags:
      - "v*"
  # Preflight only: see PREFLIGHT above. Never builds or publishes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-preflight:
    name: Trusted-publisher preflight (uploads nothing)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi   # must match the registered publisher, as `publish` does
    permissions:
      id-token: write
    steps:
      - name: Exchange the GitHub OIDC token with PyPI, then discard the result
        run: |
          set -euo pipefail
          audience="$(curl -fsS https://pypi.org/_/oidc/audience | python3 -c 'import json,sys; print(json.load(sys.stdin)["audience"])')"
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$oidc"
          status="$(curl -sS -o mint.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"token\": \"$oidc\"}" https://pypi.org/_/oidc/mint-token)"
          # Report the verdict, never the minted credential.
          python3 - "$status" <<'PY'
          import json, sys
          status = sys.argv[1]
          body = json.load(open("mint.json"))
          if status == "200" and "token" in body:
              print("PASS: PyPI accepted this workflow as a trusted publisher "
                    "(upload token minted and discarded; nothing was uploaded).")
              sys.exit(0)
          print(f"FAIL: PyPI refused the OIDC exchange (HTTP {status}).")
          print(json.dumps({k: v for k, v in body.items() if k != "token"}, indent=2))
          sys.exit(1)
          PY
          rm -f mint.json

  verify:
    name: Verify (lint, types, tests) before publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: regista_test
          POSTGRES_PASSWORD: regista_test
          POSTGRES_DB: regista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regista_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vendor-check,sidecar,ed25519,encryption,vault]"
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import importlib.metadata as m; print(m.version("regista-hraedon"))')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"
      - name: Lint
        run: ruff check src/ tests/ tools/
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest tests/ -q

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Build
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # (A) Trusted Publishing OIDC — remove if using (B)
    steps:
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      # (A) Trusted Publishing: no token needed once the publisher is registered.
      # `always` makes a failed OIDC exchange an error, with no fallback to
      # looking for credentials. Run the PREFLIGHT before tagging (#70).
      - name: Publish (trusted publishing)
        run: uv publish --trusted-publishing always
      # (B) API token variant — comment the step above and use this instead:
      # - name: Publish (API token)
      #   env:
      #     UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      #   run: uv publish --token "$UV_PUBLISH_TOKEN"

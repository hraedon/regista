name: Publish

# Build and publish regista-hraedon to PyPI when a version tag (v*) is pushed.
#
# Flow: a tag such as `v0.6.0` triggers a `verify` job (lint + type-check + the
# Postgres-backed test suite, mirroring ci.yml against the TAGGED tree, plus a
# tag==package-version guard), then a `build` job (`uv build` → sdist + wheel),
# then a `publish` job that uploads to PyPI. Each job `needs:` the previous one,
# so a tag can never publish code that did not pass the gate.
#
# AUTHENTICATION — pick ONE, configured by the repo owner before the first tag:
#
#   (A) Trusted Publishing  [RECOMMENDED — no stored secret]
#       Register this repository + this workflow file + the `pypi` environment as
#       a trusted publisher for the `regista-hraedon` project at
#       https://pypi.org/manage/account/publishing/ . The publish job's
#       `id-token: write` permission then mints a short-lived OIDC token and
#       `uv publish` (no token argument) uses it automatically.
#
#   (B) API token
#       Create a project-scoped token at https://pypi.org/manage/account/token/
#       and store it as the `PYPI_API_TOKEN` repository secret, then switch the
#       publish step to the token variant marked below.
#
# Nothing here reads a token from the host; publishing runs in GitHub Actions.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, types, tests) before publish
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: regista_test
          POSTGRES_PASSWORD: regista_test
          POSTGRES_DB: regista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regista_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vendor-check,sidecar,ed25519,encryption,vault]"
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import importlib.metadata as m; print(m.version("regista-hraedon"))')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"
      - name: Lint
        run: ruff check src/ tests/ tools/
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest tests/ -q

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Build
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # (A) Trusted Publishing OIDC — remove if using (B)
    steps:
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # (A) Trusted Publishing: no token needed once the publisher is registered.
      - name: Publish (trusted publishing)
        run: uv publish
      # (B) API token variant — comment the step above and use this instead:
      # - name: Publish (API token)
      #   env:
      #     UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      #   run: uv publish --token "$UV_PUBLISH_TOKEN"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: regista_test
          POSTGRES_PASSWORD: regista_test
          POSTGRES_DB: regista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regista_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
        with:
          # The spec set cites code by `file:line` against the pinned post-S1
          # commit 334b995; check-crossrefs.py resolves those with `git show`,
          # which needs that object present.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # vault included so the WI-228 AppRole tests actually run: without
          # hvac they fail with ModuleNotFoundError, which is how main went
          # red the moment PR #16 merged.
          pip install -e ".[dev,vendor-check,sidecar,ed25519,encryption,vault]"

      # The CLI contract v1 conformance kit (Plan 018 WI-2) is now a normal
      # pinned dependency in the [dev] extra (agent-suite-conformance==1.0.0,
      # Plan 019 B1), installed by the step above — no git+SHA step needed.

      # Denylist is never committed — it comes from the REGISTA_FORBIDDEN_IDENTIFIERS
      # repository secret (gpo-lens pattern). No-op until the secret is set.
      - name: Identifier gate
        env:
          REGISTA_FORBIDDEN_IDENTIFIERS: ${{ secrets.REGISTA_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py

      # prototypes/ included: D14 (Plan 032 open-decisions, ruled 2026-09-17)
      # — the kernel prototype is the retained implementation (D1 = EXTRACT),
      # so it gets the same lint gate as src/ and tests/ now.
      - name: Lint
        run: ruff check src/ tests/ tools/ prototypes/

      # Gate 0, P0.1: the 0.6.0 specification set is frozen, and "frozen" is only
      # true if something checks it. These two scripts are the machine-checkable
      # half of P0.1's acceptance criterion. check-crossrefs.py resolves code
      # citations against the pinned post-S1 tree with `git show`, so the full
      # history has to be present — hence fetch-depth: 0 on the checkout above
      # would be needed if the pin ever falls outside the default clone depth.
      - name: 0.6.0 specification set is internally consistent
        run: |
          python3 docs/0.6.0/check-crossrefs.py
          python3 docs/0.6.0/check-conflicts.py

      # `files` in pyproject.toml [tool.mypy] now includes prototypes/ (D14,
      # Plan 032 open-decisions, ruled 2026-09-17) alongside src/regista —
      # same strict gate, no burndown-list quarantine for the prototype.
      - name: Type-check (strict; burndown list in pyproject [tool.mypy])
        run: mypy

      # WI-245: a single --cov run covers both test + coverage. The suite used
      # to run twice (plain test, then --cov), doubling CI wall-clock with no
      # coverage gain. --durations names the slowest tests so a regression in
      # a hot file shows up in the logs instead of living only in a session
      # note. pytest-xdist stays deferred (WI-245): --dist=loadscope contends
      # on the shared Postgres service; per-worker schema isolation is the
      # prerequisite before parallelising.
      - name: Test + coverage
        run: pytest tests/ -v --cov=regista --cov-report=term-missing --durations=10 --durations-min=1.0

      # SUITE-RECONCILIATION.md §2.1: the epoch-blocked manifest node set may
      # only shrink (bootstrap: the ratified manifest digest when the base has
      # no manifest). Publishes the debt figure to the step summary — a
      # manifest-bearing green is green-with-epoch-debt(N), not "suite green".
      # Base ref: the PR's target branch for pull_request events; the
      # pre-push tip (github.event.before) for pushes — origin/main on a push
      # to main would compare the commit to itself and make the ratchet
      # vacuous.
      - name: Epoch-debt ratchet
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          python3 scripts/check-epoch-debt.py --base "$base"

      # SUITE-RECONCILIATION.md §2.1 (round-5 B6, round-6 B1): the default
      # lane inherits -m 'not slow', so slow-tier nodes would never execute.
      # Run the WHOLE slow tier — selection must not depend on manifest
      # membership, or a still-failing slow node removed from the manifest
      # would execute nowhere (the round-6 removal bypass): here a removed
      # entry runs unmarked and must prove it passes. (The former deselect for
      # tests/test_reducer_v1_determinism.py::test_cross_interpreter_sweep_if_alternates_available
      # was removed when WI-288 fixed the sweep's interpreter resolution.)
      - name: Slow tier (manifest-independent)
        run: |
          set +e
          pytest -m slow --tb=short -q
          rc=$?
          set -e
          if [ "$rc" != "0" ] && [ "$rc" != "5" ]; then exit "$rc"; fi
  # D14 (Plan 032 open-decisions, ruled 2026-09-17): prototypes/kernel is the
  # retained implementation (D1 = EXTRACT), not a throwaway — its
  # PostgreSQL-backed checks (example_handoff.py, example_documents.py,
  # test_mutations.py) get continuous CI coverage NOW, via the pytest
  # wrapper in prototypes/kernel/test_scenarios.py, so a later promotion
  # MOVES this coverage instead of creating it for the first time.
  #
  # D13 (same ruling): this is also the forward-looking Python matrix. The
  # advertised floor is requires-python >= 3.11 with no upper cap, and this
  # job is where that whole range (3.11-3.14) is actually exercised against
  # the code being advertised. The `check` job above deliberately stays on
  # 3.13/3.14 only — most of tests/ is scheduled for retirement (Plan 032)
  # and is not being back-ported to 3.11/3.12; do not extend its matrix on
  # this reasoning.
  prototype-kernel:
    name: Prototype kernel (forward-looking Python matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: regista_test
          POSTGRES_PASSWORD: regista_test
          POSTGRES_DB: regista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regista_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # example_handoff.py, example_documents.py and test_mutations.py are
      # deliberately plain `python foo.py "$DSN"` scripts (see
      # prototypes/kernel/README.md) — this wrapper runs each one exactly as
      # documented, against the service container above, and fails loudly
      # (with full stdout/stderr) on a non-zero exit. It does not change or
      # re-import the scripts' own logic.
      - name: Prototype kernel scenarios + mutation checks (PostgreSQL)
        run: pytest prototypes/kernel/test_scenarios.py -v

  # The lock is only a lock if something checks it. regista and agent-wake both
  # shipped a uv.lock that had silently stopped matching pyproject.toml — CI
  # installs unlocked, so nothing noticed until `uv run` failed on a clean
  # checkout. This job is the whole fix: it resolves, it does not install.
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Verify uv.lock agrees with pyproject.toml
        run: uv lock --check

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # requires-python is ">=3.11", so the matrix tests the advertised floor
        # (3.11) plus one modern stable lane (3.13). Two lanes keep CI cheap
        # while ensuring the declared minimum is actually exercised.
        python-version: ["3.11", "3.13"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: regista_test
          POSTGRES_PASSWORD: regista_test
          POSTGRES_DB: regista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regista_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Denylist is never committed — it comes from the REGISTA_FORBIDDEN_IDENTIFIERS
      # repository secret. No-op until the secret is set.
      - name: Identifier gate
        env:
          REGISTA_FORBIDDEN_IDENTIFIERS: ${{ secrets.REGISTA_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py

      - name: Lint
        run: ruff check src/ tests/ examples/

      - name: Type-check
        run: mypy

      - name: Test + coverage
        run: pytest tests/ -v --cov=regista --cov-report=term-missing

  # The lock is only a lock if something checks it: installs are unlocked, so a
  # uv.lock that has silently stopped matching pyproject.toml goes unnoticed.
  # This job resolves (it does not install).
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Verify uv.lock agrees with pyproject.toml
        run: uv lock --check
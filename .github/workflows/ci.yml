name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: regista_test
          POSTGRES_PASSWORD: regista_test
          POSTGRES_DB: regista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regista_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vendor-check,sidecar,ed25519,timestamping]"

      # Denylist is never committed — it comes from the REGISTA_FORBIDDEN_IDENTIFIERS
      # repository secret (gpo-lens pattern). No-op until the secret is set.
      - name: Identifier gate
        env:
          REGISTA_FORBIDDEN_IDENTIFIERS: ${{ secrets.REGISTA_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py

      - name: Lint
        run: ruff check src/ tests/

      - name: Type-check (strict; burndown list in pyproject [tool.mypy])
        run: mypy

      - name: Test
        run: pytest tests/ -v

      - name: Coverage
        run: pytest tests/ -v --cov=regista --cov-report=term-missing
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: regista_test
          POSTGRES_PASSWORD: regista_test
          POSTGRES_DB: regista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regista_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vendor-check,sidecar,ed25519,timestamping,encryption]"

      # CLI contract v1 conformance kit (Plan 018 WI-2), pinned by SHA. Installed
      # as a dedicated step — NOT a pyproject dependency — because it is a git+SHA
      # direct reference, which PyPI forbids in uploaded metadata. This step fails
      # loudly if the kit can't install, so the conformance gate can't silently
      # vanish (the test import-skips only when the kit is genuinely absent).
      - name: Install CLI conformance kit
        run: pip install "agent-suite @ git+https://github.com/hraedon/agent-suite.git@1825e6c706488d13e2823dcae9c6c9e8dc5c237c"

      # Denylist is never committed — it comes from the REGISTA_FORBIDDEN_IDENTIFIERS
      # repository secret (gpo-lens pattern). No-op until the secret is set.
      - name: Identifier gate
        env:
          REGISTA_FORBIDDEN_IDENTIFIERS: ${{ secrets.REGISTA_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py

      - name: Lint
        run: ruff check src/ tests/

      - name: Type-check (strict; burndown list in pyproject [tool.mypy])
        run: mypy

      - name: Test
        run: pytest tests/ -v

      - name: Coverage
        run: pytest tests/ -v --cov=regista --cov-report=term-missing
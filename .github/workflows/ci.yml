name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      REGISTA_TEST_DSN: postgresql://regista_test:regista_test@localhost:5432/regista_test
      REGISTA_REQUIRE_DB: "1"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: regista_test
          POSTGRES_PASSWORD: regista_test
          POSTGRES_DB: regista_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U regista_test"
          --health-interval 1s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # the full suite checks immutable schema pin ancestry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.23"
          architecture: "x86_64"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Identifier gate
        env:
          REGISTA_FORBIDDEN_IDENTIFIERS: ${{ secrets.REGISTA_FORBIDDEN_IDENTIFIERS }}
        run: python scripts/check_committed_identifiers.py
      - name: Lint
        run: ruff check src/ tests/ examples/ scripts/
      - name: Type-check (strict)
        run: mypy
      - name: Kernel protection, scenarios and mutation checks (PostgreSQL)
        run: pytest tests/ -q
      - name: Missing DSN fails hard
        run: |
          set +e
          env -u REGISTA_TEST_DSN CI=true python -m pytest tests/ -q > missing-dsn.log 2>&1
          rc=$?
          set -e
          cat missing-dsn.log
          test "$rc" = 4
          python - <<'PYTHON'
          from pathlib import Path
          assert "REGISTA_TEST_DSN is required" in Path("missing-dsn.log").read_text()
          PYTHON
      - name: Build and exercise installed wheel away from checkout
        run: |
          uv build
          python scripts/smoke_installed.py dist

  # #65 remains blocking: Plan 032 F1/D1 retire the old chain, and this job
  # now pins the fresh baseline and binds built bytes to the reviewed tree.
  published-migrations:
    name: Schema baseline and reviewed artifacts are immutable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.23"
          architecture: "x86_64"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
      - name: Verify new baseline pin and tree
        run: |
          python scripts/check_published_migrations.py verify-baseline
          python scripts/check_published_migrations.py verify-ledger
          python scripts/check_published_migrations.py check-tree
      - name: Check exact built artifacts (authoritative)
        run: |
          uv build
          guard_home="$(mktemp -d)"
          env -i PATH="$PATH" HOME="$guard_home" \
            GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            python scripts/check_published_migrations.py check-dist --authoritative dist

  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.23"
          architecture: "x86_64"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
      - run: uv lock --check

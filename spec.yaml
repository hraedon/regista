# spec.yaml — regista 0.8.0 reduced kernel
# Machine-readable sidecar to spec.md. Source of truth is spec.md.
# The pre-0.8.0 sidecar is preserved at docs/history/spec-0.7.2.yaml.

meta:
  name: "regista"
  spec_level: 3
  desired_level: 3
  date: "2026-09-11"
  version: "0.8.0"
  extensions: []
  spec_md_source: "spec.md"
  historical_spec: "docs/history/spec-0.7.2.md"

product:
  proposition: >-
    An embeddable work-coordination ledger over PostgreSQL: durable ownership,
    validated handoffs, and replayable history across independent workers and
    people.
  distribution: "regista-hraedon"
  import_name: "regista"
  console_script: "regista"
  not_a: ["job executor", "durable-execution engine", "scheduler", "hosted tracker", "human UI"]

trust_boundary:
  trusted: ["host application", "database administrators"]
  actor_id: "caller-supplied attribution, not authentication"
  role_checks: "application policy, not proof of identity"
  replay: "consistency/rebuildability check; no tamper-evidence or non-repudiation"
  lease: "one owner per attempt and stale-attempt refusal; not exactly-once external effects"

glossary:
  - term: "Project"
    definition: "Logical namespace mapping 1:1 to a PostgreSQL schema; hosts workflows."
  - term: "Workflow"
    definition: "Named, versioned declarative state machine."
  - term: "Work-item"
    definition: "Discrete unit of work with workflow version, type, state, custom fields, links, claim facts."
  - term: "Event"
    definition: "Immutable append-only record; authoritative history."
  - term: "Actor"
    definition: "Attributed entity with actor_id, actor_kind (agent/human/system), optional actor_metadata."
  - term: "Claim"
    definition: "Durable lease with TTL, attempt number, and explicit release."
  - term: "Link"
    definition: "Typed directed reference between work items or a cross-project value reference."
  - term: "Projection"
    definition: "work_items_current; denormalized state transactionally consistent with the event log."

scope:
  in_scope:
    - "Schema-per-project isolation over one shared PostgreSQL database"
    - "Versioned workflow registry with work-item version pinning"
    - "Work-item creation, structured discovery queries, and transitions"
    - "Durable claims with attempt-number fencing"
    - "Atomic event append + projection update; ordered history"
    - "Replay with honest drift/halt/warning reporting"
    - "Idempotent retries by event_id"
    - "Validated custom fields with bounded equality filtering"
    - "Typed directed links including cross-project value references"
    - "Small administration CLI"
  out_of_scope:
    - "Job execution, durable code execution, scheduling"
    - "Automatic retries / exactly-once external effects"
    - "Hosted tracker or human UI"
    - "Authentication, signing, non-repudiation, tamper-evidence"

requirements:
  workflows:
    - "Parse and JSON-Schema validate YAML declarations of states, transitions, roles, work-item types, custom fields, and link types."
    - "Enforce exactly one initial state, reachability, and declared terminal states."
    - "Register immutable, versioned definitions; identical re-registration is idempotent, different content conflicts."
  work_items:
    - "Create against the pinned workflow version; validate custom fields and work_item_ref targets."
    - "Support a not_before scheduling gate bounded to 365 days in the future."
  claims:
    - "Acquire, heartbeat, release, sweep, and auto-steal expired claims with attempt tracking."
    - "Refuse stale attempts via expected_attempt_number (CLAIM_LOST)."
    - "Escalate to needs_review once when attempt_number reaches attempt_threshold."
  events_and_projection:
    - "Append gap-free, per-entity event_seq under a canonical lock."
    - "Update work_items_current in the same transaction as the event."
    - "Refuse manual append of reserved intrinsic transitions."
  replay:
    - "Fold events in order and diff against the live projection; report ok/drift/halted/warnings."
    - "Never silently correct drift."
  idempotency:
    - "Same event_id retry returns the original event; conflicting reuse refuses."
  custom_fields:
    - "Closed type vocabulary: string, integer, boolean, timestamp, json, enum, work_item_ref."
    - "Bounded equality filtering via JSONB containment."
  links:
    - "Validate declared link types and source/target work-item types."
    - "Derive live links from link_created/link_removed events."
  queries:
    - "Filter by workflow, version, types, states, claimant, claimability, review, link type, custom fields."
    - "Order by work_item_id with cursor pagination and bounded page_size."
  cli:
    - "workflow validate, work-item show/list/create/transition, events show/tail, replay, schema init/status, actor-roles list, version, doctor."
  isolation:
    - "Validate project name; scope each transaction with SET LOCAL search_path."
    - "Refuse old or unknown schemas before writes; never auto-drop or reset."

invariants:
  - "Events are authoritative; work_items_current is a projection."
  - "Every mutation holds SELECT FOR UPDATE on the work-item row."
  - "Event append and projection update commit atomically."
  - "event_seq is gap-free and strictly ordered per entity."
  - "At most one live claim exists per work item."
  - "A refused stale attempt writes nothing."
  - "Identical event_id retries are no-ops; conflicting reuse refuses."
  - "Replay reconstructs supported state or reports drift/halt."
  - "Operations stay within the project schema."
  - "Old or unknown schemas are refused before any write."

error_codes:
  - WORK_ITEM_NOT_FOUND
  - WORKFLOW_NOT_REGISTERED
  - WORKFLOW_VERSION_CONFLICT
  - WORKFLOW_VALIDATION_FAILED
  - WORKFLOW_SEMANTIC_ERROR
  - WORK_ITEM_TYPE_NOT_DECLARED
  - CUSTOM_FIELD_VIOLATION
  - INVALID_TRANSITION
  - RESERVED_TRANSITION_NAME
  - TRANSITION_VIA_APPEND_BLOCKED
  - PRIVILEGED_TRANSITION_REQUIRED
  - ROLE_NOT_PERMITTED
  - ACTOR_ROLE_NOT_AUTHORIZED
  - ACTOR_ROLE_NOT_REGISTERED
  - CLAIM_CONTESTED
  - CLAIM_LOST
  - CLAIM_NOT_FOUND
  - NOT_BEFORE_FUTURE
  - CONCURRENT_MODIFICATION
  - IDEMPOTENCY_COLLISION_WITH_DIFFERENT_PAYLOAD
  - EVENT_ID_GLOBAL_COLLISION
  - LINK_TYPE_NOT_ALLOWED
  - LINK_TARGET_NOT_FOUND
  - LINK_CROSS_PROJECT
  - LINK_NOT_FOUND
  - INVALID_FILTER
  - INVALID_ACTOR_KIND
  - INVALID_ARGUMENT
  - DB_NOT_FOUND
  - MIGRATION_REQUIRED
  - MIGRATION_DRIFT
  - UNSUPPORTED_SCHEMA_VERSION
  - WORKFLOW_VERSION_INCOMPATIBLE

removed_in_0_8_0:
  - "Signing, keys, HMAC/Ed25519 schemes, cryptographic verification"
  - "Trust domains, genesis, root governance, estate catalogs"
  - "Principals, custody, secrets, provisioning, delegation credentials"
  - "Audit bundles and verifiers, witnesses, transparency anchoring"
  - "Async hooks/webhooks and the hook queue"
  - "Recurrence scheduling and the maintenance thread"
  - "Lineage, assurance, review policy, lint"
  - "Suite configuration and cross-component provisioning"
  - "Payload encryption-at-rest"
  - "Workflow composition (extends:) and archive"
  - "HTTP sidecar"
  - "In-memory backend"

compatibility:
  in_place_upgrade: false
  fresh_schema_required: true
  old_schema_policy: "refuse before writes; never auto-drop or reset"
  preservation: "keep old dump + matching package/deps/keys; verify a scratch restore before touching the original"

maintenance:
  scope: "release regressions and serious security/data-loss defects only"
  feature_roadmap: false
  sla: false
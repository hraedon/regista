# ---------------------------------------------------------------------------
# Assumptions
# ---------------------------------------------------------------------------

assumptions:
  - assumption: "Postgres is available on homelab K3s and provides standard ACID semantics"
    rationale: "Stated explicitly in vibe spec"
  - assumption: "Operator runs all agents and trusts them not to misdeclare role by default (actor-claimed trust tier). FR-24 provides opt-in enforcement when threat model warrants."
    rationale: "Homelab single-operator context; enforcement is available but not required."
  - assumption: "Workflow files authored by operator (not untrusted parties)"
    rationale: "Homelab single-operator context; YAML parsing safety follows"
  - assumption: "License-cost-bound but token-spend unconstrained — regista may be liberal with logging detail and event payload size"
    rationale: "Stated explicitly in vibe spec"
  - assumption: "Federated UI is downstream and adapts to regista's contract, not vice versa"
    rationale: "Vibe spec frames UI as future; regista is authoritative source"
  - assumption: "Python is acceptable as regista's implementation language for MVP"
    rationale: "Existing factory is Python; Q1 answer 'library; if non-Python needed, trivial to migrate' implies acceptance"


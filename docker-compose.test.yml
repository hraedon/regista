services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: regista_test
      POSTGRES_PASSWORD: regista_test
      POSTGRES_DB: regista_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regista_test"]
      interval: 1s
      timeout: 3s
      retries: 30
